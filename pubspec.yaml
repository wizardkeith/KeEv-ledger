name: ledger
description: KeEv Ledger native personal bookkeeping foundation.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.4 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  drift: 2.35.0
  drift_flutter: 0.3.1
  image_picker: 1.2.3
  path_provider: 2.1.6
  image: 4.10.1
  crypto: 3.0.7
  speech_to_text: 7.5.0
  flutter_secure_storage: 11.2.0
  local_auth: 3.0.2
  cryptography: 2.9.0
  supabase_flutter: 2.17.2
  sign_in_with_apple: 8.2.0
  google_sign_in: 7.2.0
  archive: 4.3.0
  file_picker: 13.1.0
  google_mobile_ads: 9.1.0
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.3
  in_app_purchase_storekit: 0.4.13
  url_launcher: 6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: 2.35.0
  build_runner: 2.16.1
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/keev-logo-original.png
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Noto Sans HK
      fonts:
        - asset: assets/fonts/NotoSansHK.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
    - family: Noto Sans Thai
      fonts:
        - asset: assets/fonts/NotoSansThai.ttf
