analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
linter:
  rules:
    - avoid_print
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - use_build_context_synchronously
    - unawaited_futures
    - prefer_const_constructors
    - prefer_final_fields
    - unnecessary_lambdas
